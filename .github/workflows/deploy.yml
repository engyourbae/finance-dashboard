name: Verify & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Izin minimum. Izin tulis Pages hanya diberikan ke job deploy.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Cek keamanan & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pindai secret di repo (gagal bila ada kunci/URL/token)
        run: node scripts/check-secrets.js
      - name: Cek sintaks
        run: for f in js/*.js scripts/*.js sw.js; do node --check "$f"; done
      - name: Uji unit (XSS, CSV, PIN, build, pemindai secret)
        run: npm test

  build:
    name: Build (suntik Secrets)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build dist/ dengan config dari GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
